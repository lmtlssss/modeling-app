name: Verify KCL logarithm version gate
on:
  push:
    branches: [verify-kcl-log-15321]
  pull_request:
    branches: [verify-kcl-log-15321]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      INSTA_UPDATE: "no"
      EXPECTORATE: check
      TWENTY_TWENTY: check
      ZOO_SIM_UPDATE: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0e83ac99f36a71b22cdfb4aa9765840b27fc223
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Run KCL regression
        run: cargo test --locked -p kcl-lib --lib test_math_logarithms_same_bits_on_every_platform -- --nocapture
      - name: Check Clippy
        run: cargo clippy --locked -p kcl-lib --lib --tests -- -D warnings
